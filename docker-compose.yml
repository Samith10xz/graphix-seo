# VPS deployment. On Hostinger the same code runs without Docker (see docs/HOSTINGER.md).
x-laravel-env: &laravel-env
  DB_HOST: mysql
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  CRAWL_ENGINE: python
  ENGINE_URL: http://engine:8000

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/app:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  app:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    volumes:
      - ./:/var/www/app
    env_file: .env
    environment: *laravel-env
    depends_on: [mysql, redis]
    restart: unless-stopped

  queue:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=900
    volumes:
      - ./:/var/www/app
    env_file: .env
    environment: *laravel-env
    depends_on: [app]
    restart: unless-stopped

  scheduler:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/app
    env_file: .env
    environment: *laravel-env
    depends_on: [app]
    restart: unless-stopped

  engine:
    build: ./engine
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on: [redis]
    restart: unless-stopped

  engine-worker:
    build: ./engine
    command: celery -A app.tasks.celery worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on: [redis]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-graphix_seo}
      MYSQL_USER: ${DB_USERNAME:-graphix}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
